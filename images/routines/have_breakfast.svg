<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="toastGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="teaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#78350f" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="40" fill="url(#bfBg)"/>
  
  <!-- Wooden Table Pattern Hint -->
  <ellipse cx="250" cy="280" rx="220" ry="170" fill="#fde68a" opacity="0.35"/>
  <ellipse cx="250" cy="280" rx="200" ry="155" fill="#fef3c7" opacity="0.5"/>

  <!-- Main Ceramic Plate -->
  <g filter="url(#softShadow)" transform="translate(190, 270)">
    <ellipse cx="0" cy="0" rx="140" ry="90" fill="url(#plateGrad)" stroke="#e2e8f0" stroke-width="4"/>
    <ellipse cx="0" cy="-4" rx="115" ry="72" fill="#ffffff"/>

    <!-- Golden Toast 1 -->
    <path d="M-85 -35 Q -75 -65, -45 -60 Q -15 -65, -5 -35 L -10 10 Q -45 15, -80 10 Z" fill="url(#toastGrad)" stroke="#92400e" stroke-width="3"/>
    <!-- Melting Butter Square -->
    <rect x="-55" y="-35" width="22" height="18" rx="4" fill="#fef08a" stroke="#facc15" stroke-width="2"/>
    
    <!-- Fried Egg Sunny Side Up -->
    <!-- Egg White -->
    <path d="M20 -30 Q 75 -45, 80 -10 Q 95 30, 45 40 Q -5 45, 5 15 Q 10 -15, 20 -30 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
    <!-- Egg Yolk -->
    <ellipse cx="45" cy="5" rx="28" ry="24" fill="#f59e0b" stroke="#d97706" stroke-width="2.5"/>
    <ellipse cx="38" cy="-2" rx="10" ry="7" fill="#fef08a" opacity="0.9"/>

    <!-- Fork on side -->
    <g transform="translate(115, -40) rotate(15)">
      <rect x="0" y="20" width="6" height="70" rx="3" fill="#94a3b8"/>
      <path d="M-6 0 L12 0 L10 24 L-4 24 Z" fill="#94a3b8"/>
      <line x1="-3" y1="0" x2="-3" y2="18" stroke="#ffffff" stroke-width="2"/>
      <line x1="3" y1="0" x2="3" y2="18" stroke="#ffffff" stroke-width="2"/>
      <line x1="9" y1="0" x2="9" y2="18" stroke="#ffffff" stroke-width="2"/>
    </g>
  </g>

  <!-- Warm Tea / Coffee Cup with Steam -->
  <g filter="url(#softShadow)" transform="translate(370, 160)">
    <!-- Cup Plate -->
    <ellipse cx="0" cy="50" rx="50" ry="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Cup Body -->
    <path d="M-30 0 L-22 45 Q 0 54, 22 45 L30 0 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
    <!-- Handle -->
    <path d="M28 8 C 45 8, 45 35, 24 35" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
    <!-- Tea Surface -->
    <ellipse cx="0" cy="0" rx="30" ry="12" fill="url(#teaGrad)"/>
    <!-- Steam Swirls -->
    <path d="M-10 -10 Q -18 -35, -5 -50 Q 8 -65, -2 -80" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M10 -15 Q 18 -40, 5 -55 Q -8 -70, 2 -85" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Time Badge (7:45 AM) -->
  <g transform="translate(70, 100)">
    <rect x="0" y="0" width="130" height="42" rx="21" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="65" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#b45309">⏰ 07:45 AM</text>
  </g>

  <!-- Label -->
  <text x="250" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#92400e" letter-spacing="1">HAVE BREAKFAST 🍳</text>
</svg>
