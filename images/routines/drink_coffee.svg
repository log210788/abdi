<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cofBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="cofShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#78350f" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="40" fill="url(#cofBg)"/>
  <circle cx="250" cy="240" r="175" fill="#ffffff" opacity="0.6"/>

  <!-- Ethiopian Coffee Cup & Jebena Pot Hint -->
  <g filter="url(#cofShadow)" transform="translate(105, 135)">
    <!-- Jebena (traditional pot on left) -->
    <circle cx="70" cy="165" r="52" fill="#451a03" stroke="#290f02" stroke-width="3"/>
    <rect x="54" y="65" width="32" height="60" rx="10" fill="#451a03"/>
    <ellipse cx="70" cy="65" rx="22" ry="8" fill="#78350f"/>
    <path d="M35 135 C 5 125, 5 170, 22 175" fill="none" stroke="#451a03" stroke-width="10" stroke-linecap="round"/>
    <path d="M84 95 L125 75" fill="none" stroke="#451a03" stroke-width="11" stroke-linecap="round"/>
    <!-- Ethiopian flag ribbon band -->
    <rect x="54" y="92" width="32" height="5" fill="#16a34a"/>
    <rect x="54" y="97" width="32" height="5" fill="#eab308"/>
    <rect x="54" y="102" width="32" height="5" fill="#dc2626"/>

    <!-- Warm Cup on Right -->
    <g transform="translate(215, 155)">
      <ellipse cx="0" cy="56" rx="64" ry="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
      <path d="M-40 0 L-28 50 Q 0 60, 28 50 L40 0 Z" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
      <path d="M36 10 C 58 10, 58 38, 32 38" fill="none" stroke="#d97706" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="0" cy="0" rx="40" ry="14" fill="#451a03"/>
      <!-- Steam -->
      <path d="M-12 -18 Q -22 -42, -6 -58 Q 10 -74, -2 -92" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      <path d="M14 -20 Q 24 -44, 8 -60 Q -8 -76, 4 -94" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>

  <text x="250" y="462" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#78350f" letter-spacing="1">DRINK COFFEE ☕</text>
</svg>
