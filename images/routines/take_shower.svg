<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="showerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="40" fill="url(#showerBg)"/>
  <circle cx="250" cy="250" r="190" fill="#ffffff" opacity="0.6"/>

  <!-- Shower Pipe & Head (Classic Brass/Ghibli aesthetic) -->
  <g filter="url(#softGlow)">
    <!-- Wall Pipe -->
    <path d="M70 110 L250 110 L250 150" fill="none" stroke="url(#headGrad)" stroke-width="16" stroke-linecap="round"/>
    <rect x="58" y="95" width="20" height="30" rx="6" fill="#92400e"/>
    <!-- Shower Head Dome -->
    <path d="M200 150 L300 150 L320 180 L180 180 Z" fill="url(#headGrad)"/>
    <ellipse cx="250" cy="180" rx="70" ry="14" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  </g>

  <!-- Water Jets & Droplets -->
  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="210" y1="195" x2="180" y2="340" stroke-dasharray="14 12"/>
    <line x1="230" y1="198" x2="215" y2="350" stroke-dasharray="16 10"/>
    <line x1="250" y1="200" x2="250" y2="360" stroke-dasharray="18 10"/>
    <line x1="270" y1="198" x2="285" y2="350" stroke-dasharray="16 10"/>
    <line x1="290" y1="195" x2="320" y2="340" stroke-dasharray="14 12"/>
  </g>

  <!-- Splashing water drops -->
  <g fill="#0284c7" opacity="0.7">
    <circle cx="170" cy="360" r="6"/>
    <circle cx="220" cy="380" r="8"/>
    <circle cx="260" cy="370" r="7"/>
    <circle cx="290" cy="385" r="5"/>
    <circle cx="330" cy="365" r="7"/>
  </g>

  <!-- Soft Soap Bar & bubbles -->
  <g transform="translate(290, 270)">
    <rect x="0" y="0" width="80" height="42" rx="14" fill="#fde68a" stroke="#f59e0b" stroke-width="3"/>
    <ellipse cx="40" cy="12" rx="26" ry="6" fill="#ffffff" opacity="0.6"/>
    <!-- Soap Bubbles -->
    <circle cx="20" cy="-15" r="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2" opacity="0.9"/>
    <circle cx="50" cy="-25" r="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2" opacity="0.9"/>
    <circle cx="70" cy="-8" r="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" opacity="0.85"/>
  </g>

  <!-- Clean Towel on Rack -->
  <g transform="translate(100, 310)">
    <rect x="0" y="0" width="70" height="90" rx="8" fill="#34d399" stroke="#059669" stroke-width="3"/>
    <line x1="12" y1="75" x2="58" y2="75" stroke="#a7f3d0" stroke-width="3"/>
    <line x1="12" y1="82" x2="58" y2="82" stroke="#a7f3d0" stroke-width="3"/>
  </g>

  <!-- Label -->
  <text x="250" y="470" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#0369a1" letter-spacing="1">TAKE A SHOWER 🚿</text>
</svg>
