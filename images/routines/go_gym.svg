<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gymBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="50%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <filter id="gymShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1e3a8a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="40" fill="url(#gymBg)"/>
  <circle cx="250" cy="240" r="180" fill="#ffffff" opacity="0.7"/>

  <!-- Dumbbell Icon -->
  <g filter="url(#gymShadow)" transform="translate(250, 240) rotate(-18)">
    <!-- Center Bar -->
    <rect x="-135" y="-16" width="270" height="32" rx="10" fill="#94a3b8" stroke="#334155" stroke-width="5"/>
    <!-- Grip texture -->
    <rect x="-55" y="-18" width="110" height="36" rx="6" fill="#ef4444" stroke="#991b1b" stroke-width="4"/>
    <!-- Left Plates -->
    <rect x="-135" y="-85" width="34" height="170" rx="12" fill="#1e293b" stroke="#0f172a" stroke-width="5"/>
    <rect x="-172" y="-65" width="30" height="130" rx="10" fill="#334155" stroke="#0f172a" stroke-width="5"/>
    <!-- Right Plates -->
    <rect x="101" y="-85" width="34" height="170" rx="12" fill="#1e293b" stroke="#0f172a" stroke-width="5"/>
    <rect x="142" y="-65" width="30" height="130" rx="10" fill="#334155" stroke="#0f172a" stroke-width="5"/>
  </g>

  <text x="250" y="462" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#1e3a8a" letter-spacing="1">GO TO THE GYM 💪</text>
</svg>
