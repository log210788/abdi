<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="eoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="50%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="eoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#9a3412" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="40" fill="url(#eoBg)"/>
  <circle cx="250" cy="235" r="175" fill="#ffffff" opacity="0.65"/>

  <!-- Cafe / Restaurant Table Scene -->
  <g filter="url(#eoShadow)" transform="translate(80, 95)">
    <!-- Bistro Umbrella -->
    <path d="M40 85 Q 170 -10, 300 85 Z" fill="#ea580c" stroke="#9a3412" stroke-width="3"/>
    <path d="M115 85 Q 170 20, 225 85 Z" fill="#fef3c7"/>
    <rect x="165" y="85" width="10" height="190" fill="#78350f"/>
    <!-- Chairs -->
    <path d="M35 200 L35 280 M35 235 L85 235 L85 280" fill="none" stroke="#78350f" stroke-width="10" stroke-linecap="round"/>
    <path d="M305 200 L305 280 M305 235 L255 235 L255 280" fill="none" stroke="#78350f" stroke-width="10" stroke-linecap="round"/>
    <!-- Cafe Table -->
    <rect x="95" y="210" width="150" height="16" rx="8" fill="#b45309" stroke="#78350f" stroke-width="3"/>
    <!-- Plate + Drink on Table -->
    <ellipse cx="150" cy="204" rx="34" ry="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="150" cy="197" r="12" fill="#f59e0b"/>
    <rect x="200" y="176" width="18" height="32" rx="4" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
  </g>

  <text x="250" y="462" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#c2410c" letter-spacing="1">EAT OUT 🍽️</text>
</svg>
