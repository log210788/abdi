<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cinBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="50%" stop-color="#fae8ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <filter id="cinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#581c87" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="40" fill="url(#cinBg)"/>
  <circle cx="250" cy="235" r="180" fill="#ffffff" opacity="0.65"/>

  <!-- Cinema Clapperboard & Ticket -->
  <g filter="url(#cinShadow)" transform="translate(115, 110)">
    <!-- Clapper Body -->
    <rect x="20" y="85" width="230" height="165" rx="16" fill="#1e293b" stroke="#0f172a" stroke-width="5"/>
    <line x1="40" y1="135" x2="230" y2="135" stroke="#475569" stroke-width="4"/>
    <line x1="40" y1="185" x2="230" y2="185" stroke="#475569" stroke-width="4"/>
    <!-- Play Triangle -->
    <polygon points="118,148 118,215 172,181" fill="#facc15"/>
    <!-- Top Clapper Bar -->
    <g transform="rotate(-10, 25, 85)">
      <rect x="18" y="45" width="232" height="36" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="4"/>
      <path d="M50 45 L75 81 L105 81 L80 45 Z" fill="#ffffff"/>
      <path d="M120 45 L145 81 L175 81 L150 45 Z" fill="#ffffff"/>
      <path d="M190 45 L215 81 L240 81 L215 45 Z" fill="#ffffff"/>
    </g>
  </g>

  <text x="250" y="462" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#6b21a8" letter-spacing="1">THE CINEMA 🎬</text>
</svg>
