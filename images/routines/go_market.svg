<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mktBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="50%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="mktShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#78350f" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="40" fill="url(#mktBg)"/>
  <circle cx="250" cy="235" r="180" fill="#ffffff" opacity="0.65"/>

  <!-- Market Stall -->
  <g filter="url(#mktShadow)" transform="translate(80, 95)">
    <!-- Posts -->
    <rect x="25" y="95" width="14" height="190" rx="5" fill="#92400e"/>
    <rect x="300" y="95" width="14" height="190" rx="5" fill="#92400e"/>
    <!-- Awning -->
    <path d="M5 90 L35 25 L305 25 L335 90 Z" fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
    <path d="M65 25 L48 90 L98 90 L110 25 Z" fill="#ffffff"/>
    <path d="M150 25 L145 90 L195 90 L190 25 Z" fill="#ffffff"/>
    <path d="M235 25 L242 90 L292 90 L275 25 Z" fill="#ffffff"/>
    <!-- Counter -->
    <rect x="15" y="210" width="310" height="80" rx="14" fill="#d97706" stroke="#78350f" stroke-width="4"/>
    <rect x="10" y="198" width="320" height="22" rx="8" fill="#f59e0b" stroke="#78350f" stroke-width="3"/>
    <!-- Fresh Fruit Baskets -->
    <ellipse cx="95" cy="188" rx="45" ry="20" fill="#b45309"/>
    <circle cx="78" cy="176" r="15" fill="#ef4444"/>
    <circle cx="100" cy="172" r="16" fill="#22c55e"/>
    <circle cx="116" cy="180" r="14" fill="#f97316"/>
    <ellipse cx="235" cy="188" rx="48" ry="20" fill="#b45309"/>
    <circle cx="215" cy="176" r="15" fill="#eab308"/>
    <circle cx="238" cy="172" r="16" fill="#ef4444"/>
    <circle cx="258" cy="178" r="15" fill="#84cc16"/>
  </g>

  <text x="250" y="462" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#15803d" letter-spacing="1">GO TO THE MARKET 🧺</text>
</svg>
