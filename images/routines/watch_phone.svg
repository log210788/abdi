<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="wpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="40" fill="url(#wpBg)"/>
  <circle cx="250" cy="230" r="175" fill="#ffffff" opacity="0.65"/>

  <!-- Smartphone -->
  <g filter="url(#wpShadow)" transform="translate(155, 70)">
    <rect x="0" y="0" width="190" height="330" rx="28" fill="url(#phoneBody)" stroke="#475569" stroke-width="4"/>
    <!-- Screen -->
    <rect x="12" y="22" width="166" height="275" rx="18" fill="#ffffff"/>
    <!-- Video Player Box -->
    <rect x="20" y="42" width="150" height="120" rx="14" fill="url(#screenGrad)"/>
    <!-- Play Triangle -->
    <circle cx="95" cy="102" r="28" fill="#ffffff" opacity="0.92"/>
    <polygon points="87,88 87,116 112,102" fill="#2563eb"/>
    <!-- Progress bar -->
    <rect x="28" y="146" width="134" height="6" rx="3" fill="rgba(255,255,255,0.4)"/>
    <rect x="28" y="146" width="75" height="6" rx="3" fill="#fde047"/>
    <!-- Mini video list below -->
    <rect x="20" y="176" width="52" height="38" rx="8" fill="#bae6fd"/>
    <rect x="80" y="182" width="82" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="80" y="198" width="56" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="20" y="224" width="52" height="38" rx="8" fill="#fde68a"/>
    <rect x="80" y="230" width="82" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="80" y="246" width="48" height="8" rx="4" fill="#e2e8f0"/>
    <!-- Speaker & Home Bar -->
    <rect x="75" y="10" width="40" height="5" rx="2.5" fill="#64748b"/>
    <rect x="65" y="310" width="60" height="6" rx="3" fill="#64748b"/>
  </g>

  <!-- Green YES badge -->
  <g transform="translate(330, 85)">
    <circle cx="32" cy="32" r="32" fill="#16a34a" stroke="#ffffff" stroke-width="4"/>
    <path d="M18 33 L28 43 L47 22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="250" y="462" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#0f766e" letter-spacing="1">WATCH MY PHONE 📱</text>
</svg>
