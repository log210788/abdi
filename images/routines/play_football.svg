<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="60%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <filter id="fbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#14532d" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="40" fill="url(#fbBg)"/>
  <!-- Sunlit Grass Hill -->
  <path d="M0 320 Q 250 265, 500 320 L500 460 Q 500 500, 460 500 L40 500 Q 0 500, 0 460 Z" fill="#86efac" opacity="0.65"/>

  <!-- Soccer Ball -->
  <g filter="url(#fbShadow)" transform="translate(250, 235)">
    <circle cx="0" cy="0" r="115" fill="#ffffff" stroke="#1e293b" stroke-width="5"/>
    <!-- Center Pentagon -->
    <polygon points="0,-38 36,-12 22,30 -22,30 -36,-12" fill="#1e293b"/>
    <!-- Seam Lines -->
    <line x1="0" y1="-38" x2="0" y2="-82" stroke="#1e293b" stroke-width="5"/>
    <line x1="36" y1="-12" x2="80" y2="-28" stroke="#1e293b" stroke-width="5"/>
    <line x1="22" y1="30" x2="54" y2="72" stroke="#1e293b" stroke-width="5"/>
    <line x1="-22" y1="30" x2="-54" y2="72" stroke="#1e293b" stroke-width="5"/>
    <line x1="-36" y1="-12" x2="-80" y2="-28" stroke="#1e293b" stroke-width="5"/>
    <!-- Outer Edge Pentagons -->
    <polygon points="-24,-108 24,-108 0,-82" fill="#1e293b"/>
    <polygon points="95,-58 112,-10 80,-28" fill="#1e293b"/>
    <polygon points="-95,-58 -112,-10 -80,-28" fill="#1e293b"/>
    <polygon points="36,104 82,78 54,72" fill="#1e293b"/>
    <polygon points="-36,104 -82,78 -54,72" fill="#1e293b"/>
  </g>

  <text x="250" y="462" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#15803d" letter-spacing="1">PLAY FOOTBALL ⚽</text>
</svg>
