<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="50%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="brushGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="pasteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#047857" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="500" rx="40" fill="url(#bgGrad)"/>
  <circle cx="250" cy="250" r="190" fill="#ffffff" opacity="0.6"/>
  <circle cx="250" cy="250" r="160" fill="none" stroke="#6ee7b7" stroke-width="3" stroke-dasharray="8 8" opacity="0.7"/>

  <!-- Morning Sunbeam sparkle -->
  <circle cx="110" cy="110" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="390" cy="130" r="8" fill="#f59e0b" opacity="0.7"/>
  <circle cx="370" cy="380" r="5" fill="#10b981" opacity="0.6"/>

  <!-- Main Toothbrush Visual -->
  <g filter="url(#softGlow)" transform="rotate(-30 250 250)">
    <!-- Toothbrush Handle -->
    <rect x="235" y="160" width="30" height="230" rx="15" fill="url(#brushGrad)"/>
    <!-- Grip Accent -->
    <rect x="240" y="240" width="20" height="80" rx="10" fill="#bae6fd" opacity="0.85"/>
    <rect x="245" y="260" width="10" height="15" rx="5" fill="#0284c7" opacity="0.5"/>
    <rect x="245" y="285" width="10" height="15" rx="5" fill="#0284c7" opacity="0.5"/>
    
    <!-- Brush Head Base -->
    <rect x="230" y="100" width="40" height="70" rx="12" fill="#0284c7"/>
    <!-- Bristles -->
    <rect x="233" y="70" width="34" height="35" rx="6" fill="#f8fafc"/>
    <rect x="237" y="70" width="12" height="35" rx="4" fill="#38bdf8"/>
    
    <!-- Toothpaste Swirl -->
    <path d="M225 72 Q 240 50, 260 62 T 275 68 Q 260 80, 230 75 Z" fill="url(#pasteGrad)"/>
    <circle cx="270" cy="62" r="3" fill="#ffffff"/>
  </g>

  <!-- Foamy Bubbles -->
  <circle cx="180" cy="170" r="18" fill="#ffffff" stroke="#bae6fd" stroke-width="2.5" opacity="0.95"/>
  <circle cx="174" cy="165" r="5" fill="#ffffff"/>
  <circle cx="160" cy="205" r="12" fill="#ffffff" stroke="#bae6fd" stroke-width="2" opacity="0.9"/>
  <circle cx="210" cy="150" r="14" fill="#ffffff" stroke="#bae6fd" stroke-width="2" opacity="0.9"/>
  <circle cx="330" cy="160" r="16" fill="#ffffff" stroke="#bae6fd" stroke-width="2.5" opacity="0.95"/>
  <circle cx="355" cy="185" r="10" fill="#ffffff" stroke="#bae6fd" stroke-width="2" opacity="0.9"/>
  <circle cx="320" cy="130" r="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" opacity="0.85"/>

  <!-- Bathroom Glass Rinse Cup -->
  <path d="M120 340 L135 430 Q 175 440, 215 430 L230 340 Z" fill="#93c5fd" opacity="0.4" stroke="#60a5fa" stroke-width="4"/>
  <ellipse cx="175" cy="340" rx="55" ry="14" fill="#dbeafe" opacity="0.8" stroke="#60a5fa" stroke-width="3"/>

  <!-- Sparkles -->
  <path d="M370 240 Q 380 240, 380 230 Q 380 240, 390 240 Q 380 240, 380 250 Q 380 240, 370 240 Z" fill="#fbbf24"/>
  <path d="M130 250 Q 140 250, 140 240 Q 140 250, 150 250 Q 140 250, 140 260 Q 140 250, 130 250 Z" fill="#34d399"/>

  <!-- Text Label -->
  <text x="250" y="470" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#065f46" letter-spacing="1">BRUSH MY TEETH 🪥</text>
</svg>
