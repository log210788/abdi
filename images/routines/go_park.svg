<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="parkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="55%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <filter id="parkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14532d" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="40" fill="url(#parkBg)"/>
  <!-- Sun -->
  <circle cx="400" cy="95" r="42" fill="#facc15" opacity="0.9"/>
  <!-- Rolling Green Hills -->
  <path d="M0 320 Q 170 270, 340 315 T 500 305 L500 460 Q 500 500, 460 500 L40 500 Q 0 500, 0 460 Z" fill="#86efac" opacity="0.85"/>
  <!-- Park Path -->
  <path d="M210 312 Q 250 370, 175 430 L285 430 Q 330 370, 265 312 Z" fill="#fde68a" opacity="0.9"/>

  <!-- Big Lush Tree & Park Bench -->
  <g filter="url(#parkShadow)">
    <!-- Tree Trunk -->
    <rect x="135" y="210" width="34" height="125" rx="10" fill="#78350f"/>
    <path d="M152 245 L182 215" stroke="#78350f" stroke-width="10" stroke-linecap="round"/>
    <path d="M152 255 L122 225" stroke="#78350f" stroke-width="10" stroke-linecap="round"/>
    <!-- Tree Canopy -->
    <circle cx="152" cy="145" r="64" fill="#16a34a"/>
    <circle cx="105" cy="175" r="48" fill="#22c55e"/>
    <circle cx="198" cy="175" r="48" fill="#15803d"/>
    <circle cx="152" cy="188" r="50" fill="#22c55e"/>

    <!-- Park Bench -->
    <g transform="translate(265, 255)">
      <rect x="10" y="45" width="10" height="42" rx="3" fill="#475569"/>
      <rect x="125" y="45" width="10" height="42" rx="3" fill="#475569"/>
      <rect x="0" y="20" width="145" height="14" rx="5" fill="#d97706" stroke="#78350f" stroke-width="3"/>
      <rect x="0" y="38" width="145" height="12" rx="5" fill="#f59e0b" stroke="#78350f" stroke-width="3"/>
      <rect x="-6" y="54" width="157" height="14" rx="6" fill="#b45309" stroke="#78350f" stroke-width="3"/>
    </g>
  </g>

  <text x="250" y="462" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#14532d" letter-spacing="1">GO TO THE PARK 🌳</text>
</svg>
