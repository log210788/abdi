<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="studyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="lampGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </linearGradient>
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="40" fill="url(#studyBg)"/>
  <circle cx="250" cy="240" r="185" fill="#ffffff" opacity="0.6"/>

  <!-- Study Desk Lamp Cone Light -->
  <polygon points="120,130 0,420 340,420" fill="url(#lampGlow)" opacity="0.55"/>

  <!-- Vintage Desk Lamp (Ghibli style) -->
  <g transform="translate(60, 80)">
    <!-- Base -->
    <ellipse cx="60" cy="180" rx="30" ry="10" fill="#78350f" stroke="#451a03" stroke-width="3"/>
    <!-- Angled Arm -->
    <path d="M60 180 L50 100 L95 65" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>
    <circle cx="50" cy="100" r="6" fill="#78350f"/>
    <circle cx="95" cy="65" r="6" fill="#78350f"/>
    <!-- Lamp Shade -->
    <path d="M85 55 L135 75 L115 105 L65 85 Z" fill="#b45309" stroke="#78350f" stroke-width="3"/>
    <ellipse cx="90" cy="95" rx="28" ry="12" fill="#fef08a"/>
  </g>

  <!-- Main Open English Textbook -->
  <g filter="url(#bookShadow)" transform="translate(130, 200)">
    <!-- Book Hard Cover Rim -->
    <path d="M20 180 Q 120 160, 240 180 L250 190 Q 120 170, 10 190 Z" fill="#1e3a8a"/>
    <!-- Left Open Page -->
    <path d="M25 60 Q 120 50, 120 70 L120 170 Q 25 150, 25 170 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Right Open Page -->
    <path d="M120 70 Q 120 50, 215 60 L215 170 Q 120 150, 120 170 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Center Spine Binding Shadow -->
    <line x1="120" y1="55" x2="120" y2="175" stroke="#94a3b8" stroke-width="3"/>

    <!-- Text Lines on Left Page -->
    <text x="70" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2563eb">ENGLISH</text>
    <line x1="40" y1="102" x2="105" y2="102" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="40" y1="116" x2="95" y2="116" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Yellow Highlighter mark -->
    <rect x="38" y="124" width="65" height="10" rx="3" fill="#fef08a" opacity="0.8"/>
    <line x1="40" y1="130" x2="100" y2="130" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="144" x2="90" y2="144" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Text Lines on Right Page -->
    <text x="165" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#059669">ROUTINES</text>
    <line x1="135" y1="102" x2="200" y2="102" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Green Highlighter mark -->
    <rect x="133" y="110" width="60" height="10" rx="3" fill="#bbf7d0" opacity="0.8"/>
    <line x1="135" y1="116" x2="190" y2="116" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <line x1="135" y1="130" x2="195" y2="130" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="135" y1="144" x2="180" y2="144" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Pen Resting on Book -->
    <g transform="translate(180, 110) rotate(35)">
      <rect x="0" y="0" width="8" height="60" rx="4" fill="#0284c7"/>
      <polygon points="0,60 8,60 4,70" fill="#facc15"/>
      <circle cx="4" cy="70" r="1.5" fill="#0f172a"/>
    </g>
  </g>

  <!-- Stack of Hardcover Books on right -->
  <g transform="translate(365, 270)">
    <!-- Book 1 (Red) -->
    <rect x="0" y="40" width="75" height="18" rx="4" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
    <!-- Book 2 (Green) -->
    <rect x="-5" y="22" width="80" height="18" rx="4" fill="#10b981" stroke="#047857" stroke-width="2"/>
    <!-- Book 3 (Orange) -->
    <rect x="5" y="5" width="70" height="17" rx="4" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  </g>

  <!-- Label -->
  <text x="250" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#1e40af" letter-spacing="1">STUDY ENGLISH 📚</text>
</svg>
