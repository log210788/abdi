<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="clothBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="50%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="hangerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#14532d" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="40" fill="url(#clothBg)"/>
  <circle cx="250" cy="240" r="185" fill="#ffffff" opacity="0.6"/>

  <g filter="url(#shadow)">
    <!-- Wooden Clothes Hanger Hook -->
    <path d="M250 85 C240 85, 230 100, 245 115 C255 125, 250 145, 250 150" fill="none" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
    <!-- Wooden Hanger Arms -->
    <path d="M140 190 L250 150 L360 190 L345 205 L250 170 L155 205 Z" fill="url(#hangerGrad)"/>
    <!-- Crossbar -->
    <rect x="160" y="200" width="180" height="10" rx="5" fill="#78350f"/>

    <!-- Green Hoodie / Jacket (Abdi's iconic outfit) -->
    <path d="M170 190 L210 175 L250 195 L290 175 L330 190 L380 280 L340 300 L320 230 L320 370 L180 370 L180 230 L160 300 L120 280 Z" fill="url(#hoodieGrad)"/>
    
    <!-- White / Blue Striped T-Shirt Collar inside -->
    <path d="M210 175 Q 250 215, 290 175 L275 240 Q 250 255, 225 240 Z" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <line x1="225" y1="195" x2="275" y2="195" stroke="#3b82f6" stroke-width="3"/>
    <line x1="228" y1="210" x2="272" y2="210" stroke="#3b82f6" stroke-width="3"/>
    <line x1="235" y1="225" x2="265" y2="225" stroke="#3b82f6" stroke-width="3"/>

    <!-- Zipper & Pockets -->
    <line x1="250" y1="250" x2="250" y2="370" stroke="#14532d" stroke-width="3" stroke-dasharray="6 4"/>
    <path d="M195 285 L235 285 L235 340 L195 340 Z" fill="#16a34a" rx="6"/>
    <path d="M265 285 L305 285 L305 340 L265 340 Z" fill="#16a34a" rx="6"/>

    <!-- Hoodie Strings -->
    <path d="M225 190 Q 220 230, 223 250" fill="none" stroke="#fef08a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="223" cy="252" r="4" fill="#ca8a04"/>
    <path d="M275 190 Q 280 230, 277 250" fill="none" stroke="#fef08a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="277" cy="252" r="4" fill="#ca8a04"/>
  </g>

  <!-- Sparkles -->
  <circle cx="120" cy="140" r="5" fill="#f59e0b"/>
  <circle cx="390" cy="140" r="7" fill="#10b981"/>
  <circle cx="380" cy="350" r="5" fill="#3b82f6"/>

  <!-- Label -->
  <text x="250" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#15803d" letter-spacing="1">GET DRESSED 👕</text>
</svg>
