<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="lunchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="50%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="breadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="lunchShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#b45309" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="40" fill="url(#lunchBg)"/>
  <circle cx="250" cy="240" r="185" fill="#ffffff" opacity="0.65"/>

  <!-- Sunbeam & Cloud -->
  <circle cx="410" cy="90" r="28" fill="#facc15" opacity="0.8"/>
  <circle cx="410" cy="90" r="42" fill="#fef08a" opacity="0.3"/>

  <!-- Picnic Mat / Plate -->
  <ellipse cx="250" cy="300" rx="200" ry="120" fill="#fed7aa" opacity="0.5"/>
  <ellipse cx="250" cy="295" rx="170" ry="100" fill="#ffffff" opacity="0.8"/>

  <!-- Main Ghibli Club Sandwich Group -->
  <g filter="url(#lunchShadow)" transform="translate(140, 180)">
    <!-- Bottom Bread Slice -->
    <path d="M10 90 L210 90 L180 125 L-20 125 Z" fill="url(#breadGrad)"/>
    <!-- Cheese Layer with melt points -->
    <path d="M0 88 L200 88 L215 95 L190 98 L175 92 L150 96 L130 90 L-10 92 Z" fill="#facc15"/>
    <!-- Crispy Lettuce Ruffles -->
    <path d="M-15 80 Q 20 65, 50 82 Q 90 68, 130 83 Q 170 65, 205 80 L 195 90 Q 150 78, 110 88 Q 70 75, -5 90 Z" fill="#22c55e"/>
    <path d="M-10 82 Q 25 70, 55 83 Q 95 70, 135 84 Q 175 68, 200 82" stroke="#15803d" stroke-width="2" fill="none"/>
    <!-- Fresh Tomato Slices -->
    <ellipse cx="35" cy="74" rx="26" ry="7" fill="#ef4444"/>
    <ellipse cx="95" cy="74" rx="28" ry="7" fill="#dc2626"/>
    <ellipse cx="155" cy="74" rx="26" ry="7" fill="#ef4444"/>
    <!-- Top Bread Slice -->
    <path d="M5 40 L205 40 L185 72 L-15 72 Z" fill="url(#breadGrad)"/>
    <!-- Sandwich Twine / Wrapper Band -->
    <rect x="85" y="38" width="22" height="88" fill="#fef3c7" opacity="0.9" stroke="#d97706" stroke-width="2"/>
    <line x1="96" y1="38" x2="96" y2="126" stroke="#b45309" stroke-width="2"/>
  </g>

  <!-- Crisp Red Apple on the left -->
  <g transform="translate(90, 270)">
    <circle cx="28" cy="28" r="28" fill="#ef4444"/>
    <ellipse cx="20" cy="20" rx="8" ry="14" fill="#fca5a5" opacity="0.6"/>
    <path d="M28 0 Q 32 -14, 25 -18" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <path d="M28 -8 Q 44 -16, 40 -6 Z" fill="#22c55e"/>
  </g>

  <!-- Juice Box / Water Bottle on right -->
  <g transform="translate(360, 240)">
    <rect x="0" y="20" width="55" height="80" rx="10" fill="#38bdf8" stroke="#0284c7" stroke-width="3"/>
    <rect x="10" y="35" width="35" height="30" rx="6" fill="#ffffff" opacity="0.8"/>
    <!-- Straw -->
    <path d="M25 20 L25 -8 L40 -16" fill="none" stroke="#f43f5e" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Time Badge (1:00 PM) -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="130" height="38" rx="19" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/>
    <text x="65" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#c2410c">⏰ 01:00 PM</text>
  </g>

  <!-- Label -->
  <text x="250" y="465" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#c2410c" letter-spacing="1">EAT LUNCH 🥪</text>
</svg>
