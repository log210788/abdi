<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="50%" stop-color="#fceddb" />
      <stop offset="100%" stop-color="#f0dac2" />
    </radialGradient>

    <!-- Wood Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d6a06e" />
      <stop offset="100%" stop-color="#ba7f4e" />
    </linearGradient>

    <!-- 3D Letters Gradients -->
    <linearGradient id="nextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <linearGradient id="toGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Cat Fur Gradients -->
    <linearGradient id="catFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="catChest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <!-- Cardboard Box Gradients -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a373" />
      <stop offset="100%" stop-color="#bc8a5f" />
    </linearGradient>
    <linearGradient id="boxDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a97142" />
      <stop offset="100%" stop-color="#8f562b" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.18" />
    </filter>
    <filter id="textShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.25" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Wall -->
  <rect width="800" height="800" fill="url(#bgGrad)" />

  <!-- Wooden Floor -->
  <rect y="580" width="800" height="220" fill="url(#floorGrad)" />
  <line x1="0" y1="580" x2="800" y2="580" stroke="#935c34" stroke-width="4" opacity="0.6" />
  <line x1="0" y1="650" x2="800" y2="650" stroke="#935c34" stroke-width="2" opacity="0.4" />
  <line x1="0" y1="720" x2="800" y2="720" stroke="#935c34" stroke-width="2" opacity="0.4" />

  <!-- 3D "NEXT TO" TITLE -->
  <g filter="url(#textShadow)">
    <!-- White border / bubble behind text -->
    <text x="400" y="170" text-anchor="middle" font-family="'Fredoka', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="105" fill="#ffffff" stroke="#ffffff" stroke-width="22" stroke-linejoin="round" letter-spacing="4">
      NEXT TO
    </text>
    <!-- Text Extrusion 3D effect -->
    <text x="400" y="176" text-anchor="middle" font-family="'Fredoka', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="105" fill="#0f766e" letter-spacing="4">
      NEXT TO
    </text>
    <text x="400" y="170" text-anchor="middle" font-family="'Fredoka', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="105" fill="url(#nextGrad)" letter-spacing="4">
      NEXT TO
    </text>
  </g>

  <!-- Sparkles / Paws above text -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="160" cy="110" r="10" />
    <circle cx="145" cy="95" r="5" />
    <circle cx="175" cy="95" r="5" />
    <circle cx="640" cy="110" r="10" />
    <circle cx="625" cy="95" r="5" />
    <circle cx="655" cy="95" r="5" />
  </g>

  <!-- Ground Shadows under Box and Cat -->
  <ellipse cx="250" cy="670" rx="150" ry="30" fill="#000000" opacity="0.22" />
  <ellipse cx="530" cy="675" rx="140" ry="28" fill="#000000" opacity="0.25" />

  <!-- CARDBOARD BOX (LEFT SIDE) -->
  <g filter="url(#dropShadow)">
    <!-- Box Body Front Face -->
    <rect x="120" y="440" width="240" height="210" rx="14" fill="url(#boxGrad)" stroke="#a97142" stroke-width="4" />
    
    <!-- Box Left Flap Open -->
    <polygon points="120,440 80,380 180,395 180,440" fill="url(#boxDark)" opacity="0.8" />
    <!-- Box Right Flap Open -->
    <polygon points="280,440 280,395 380,380 360,440" fill="url(#boxDark)" opacity="0.8" />
    <!-- Box Front Flap Down -->
    <polygon points="150,440 170,490 310,490 330,440" fill="#b07d50" stroke="#8f562b" stroke-width="2" />

    <!-- Packaging Tape -->
    <rect x="220" y="440" width="40" height="210" fill="#e9c46a" opacity="0.75" />

    <!-- Fragile Badge -->
    <g transform="translate(145, 530) rotate(-6)">
      <rect width="100" height="34" rx="6" fill="#ef4444" />
      <text x="50" y="23" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="16" fill="#ffffff" letter-spacing="2">FRAGILE</text>
    </g>

    <!-- Up Arrows on Box -->
    <g transform="translate(290, 520)" stroke="#603813" stroke-width="3" fill="none">
      <path d="M 12 35 L 12 12 M 6 18 L 12 12 L 18 18" />
      <path d="M 32 35 L 32 12 M 26 18 L 32 12 L 38 18" />
    </g>
  </g>

  <!-- GINGER CAT (RIGHT SIDE - SITTING RIGHT NEXT TO THE BOX) -->
  <g filter="url(#dropShadow)">
    
    <!-- Cat Tail -->
    <path d="M 620 630 C 690 640 710 560 680 500 C 665 470 640 500 655 525 C 670 550 645 605 600 615 Z" fill="url(#catFur)" />
    <!-- Tail tip cream -->
    <circle cx="672" cy="495" r="14" fill="#fff7ed" />

    <!-- Cat Body -->
    <path d="M 450 640 C 440 540 470 450 540 450 C 610 450 640 540 630 640 Z" fill="url(#catFur)" />

    <!-- White / Cream Chest -->
    <path d="M 495 530 C 475 570 480 620 535 625 C 590 620 595 570 575 530 C 560 550 510 550 495 530 Z" fill="url(#catChest)" />

    <!-- Front Paws -->
    <!-- Left Paw -->
    <ellipse cx="505" cy="650" rx="22" ry="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2" />
    <path d="M 498 642 L 498 660 M 512 642 L 512 660" stroke="#ea580c" stroke-width="2" />
    <!-- Right Paw -->
    <ellipse cx="565" cy="650" rx="22" ry="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2" />
    <path d="M 558 642 L 558 660 M 572 642 L 572 660" stroke="#ea580c" stroke-width="2" />

    <!-- Cat Head -->
    <ellipse cx="535" cy="400" rx="85" ry="75" fill="url(#catFur)" />

    <!-- Ears -->
    <!-- Left Ear -->
    <polygon points="460,360 450,280 510,335" fill="url(#catFur)" stroke="#ea580c" stroke-width="3" />
    <polygon points="465,350 458,295 500,335" fill="#fecdd3" />
    <!-- Right Ear -->
    <polygon points="610,360 620,280 560,335" fill="url(#catFur)" stroke="#ea580c" stroke-width="3" />
    <polygon points="605,350 612,295 570,335" fill="#fecdd3" />

    <!-- Cheeks Fluff -->
    <path d="M 450 420 Q 425 430 445 445 Q 430 455 455 460" fill="url(#catFur)" />
    <path d="M 620 420 Q 645 430 625 445 Q 640 455 615 460" fill="url(#catFur)" />

    <!-- Big Cute Green Eyes (Pixar style) -->
    <!-- Left Eye Outer -->
    <ellipse cx="495" cy="395" rx="22" ry="26" fill="#ffffff" />
    <ellipse cx="495" cy="395" rx="18" ry="22" fill="#22c55e" />
    <circle cx="495" cy="395" r="12" fill="#0f172a" />
    <circle cx="490" cy="388" r="6" fill="#ffffff" />
    <circle cx="502" cy="404" r="3" fill="#ffffff" />

    <!-- Right Eye Outer -->
    <ellipse cx="575" cy="395" rx="22" ry="26" fill="#ffffff" />
    <ellipse cx="575" cy="395" rx="18" ry="22" fill="#22c55e" />
    <circle cx="575" cy="395" r="12" fill="#0f172a" />
    <circle cx="570" cy="388" r="6" fill="#ffffff" />
    <circle cx="582" cy="404" r="3" fill="#ffffff" />

    <!-- Cute Pink Nose & Mouth -->
    <polygon points="530,422 540,422 535,428" fill="#fb7185" />
    <path d="M 535 428 Q 525 438 518 433 M 535 428 Q 545 438 552 433" stroke="#9a3412" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Whiskers -->
    <path d="M 470 425 L 415 418 M 470 435 L 410 435 M 470 445 L 420 452" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <path d="M 600 425 L 655 418 M 600 435 L 660 435 M 600 445 L 650 452" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />

    <!-- Tabby Stripes on Forehead -->
    <path d="M 535 345 L 535 365 M 520 350 L 525 368 M 550 350 L 545 368" stroke="#c2410c" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Animated double-headed relation arrow between Box and Cat -->
  <g transform="translate(355, 520)" filter="url(#dropShadow)">
    <circle cx="35" cy="0" r="28" fill="#ffffff" stroke="#10b981" stroke-width="4" />
    <path d="M 22 0 L 48 0 M 27 -6 L 20 0 L 27 6 M 43 -6 L 50 0 L 43 6" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
